name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,render]"

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check src tests training tools examples

  training-smoke:
    name: Training import smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,train,video,legacy]"

      - name: Import training modules
        run: python -c "import torch; import training.checkpoint; import training.sac"

      - name: Run training tests with PyTorch installed
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests/training tests/test_legacy.py

  examples:
    name: Examples (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install optional example and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,examples]" "nbclient>=0.10,<1"

      - name: Test SB3 integration and execute the notebook
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests/examples

      - name: Run the documented demo command
        env:
          MPLBACKEND: Agg
        run: python -m examples.sb3_quickstart demo --episodes 1

  build:
    name: Build and install smoke test
    needs: [test, lint, training-smoke, examples]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify example files in the source release
        run: python tests/packaging/check_examples.py dist

      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/longicontrol-smoke"
          "$RUNNER_TEMP/longicontrol-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/longicontrol-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/longicontrol-smoke/bin/python" -m pip check

      - name: Verify installed package and assets
        run: >-
          "$RUNNER_TEMP/longicontrol-smoke/bin/python" -I
          tests/packaging/smoke_install.py
