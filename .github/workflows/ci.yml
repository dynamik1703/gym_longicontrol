name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,render]"

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check src tests training tools examples

  training-smoke:
    name: Training import smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,train,video,legacy]"

      - name: Import training modules
        run: python -c "import torch; import training.checkpoint; import training.sac"

      - name: Run training tests with PyTorch installed
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests/training tests/test_legacy.py

  examples:
    name: Examples (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install optional example and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,examples]" "nbclient>=0.10,<1"

      - name: Test SB3 integration and execute the notebook
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests/examples

      - name: Run the documented demo command
        env:
          MPLBACKEND: Agg
        run: python -m examples.sb3_quickstart demo --episodes 1

  morl:
    name: MORL integration (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install native dependency for MORL-Baselines
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev

      - name: Install optional MORL and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,morl]"
          python -m pip check

      - name: Test MO contract, CAPQL updates, and scalarized SAC comparison
        env:
          MPLBACKEND: Agg
          WANDB_MODE: disabled
        run: python -m pytest tests/test_multi_objective.py tests/morl

      - name: Run documented offline smoke comparison
        env:
          MPLBACKEND: Agg
          WANDB_MODE: disabled
        run: >-
          python -m examples.morl_baselines --output runs/morl-smoke
          --steps 125 --train-seeds 42 --eval-seeds 1001
          --learning-starts 8 --batch-size 8 --max-episode-steps 8

  build:
    name: Build and install smoke test
    needs: [test, lint, training-smoke, examples, morl]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify example files in the source release
        run: python tests/packaging/check_examples.py dist

      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/longicontrol-smoke"
          "$RUNNER_TEMP/longicontrol-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/longicontrol-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/longicontrol-smoke/bin/python" -m pip check

      - name: Verify installed package and assets
        run: >-
          "$RUNNER_TEMP/longicontrol-smoke/bin/python" -I
          tests/packaging/smoke_install.py
